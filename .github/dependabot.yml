# Opens PRs when something the releases depend on has a new version.
#
# INFO: For pip, only bundle/ is watched. pyproject.toml holds minimums for source installs and
# shouldn't move every time yt-dlp releases.

version: 2
updates:
  # Tools bundled into the executables. checks.yml merges these PRs once they pass.
  - package-ecosystem: pip
    directory: /bundle
    schedule:
      interval: daily
    # One PR for everything that's out of date, so a day with yt-dlp and gallery-dl updates makes
    # one release, not two.
    groups:
      bundled-tools:
        patterns: ["*"]
    commit-message:
      prefix: "Update bundled tools"

  # Actions used by the workflows (checkout, setup-python, ...). These PRs wait for you to merge.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "Update GitHub Actions"
