# Opens a PR when a tool bundled into the release executables has a new version.
#
# INFO: Only bundle/ is watched. pyproject.toml holds minimums for source installs and shouldn't
# move every time yt-dlp releases.

version: 2
updates:
  - package-ecosystem: pip
    directory: /bundle
    schedule:
      interval: daily
    # One PR for everything that's out of date, so a day with yt-dlp and gallery-dl updates makes
    # one release, not two.
    groups:
      bundled-tools:
        patterns: ["*"]
    commit-message:
      prefix: "Update bundled tools"
