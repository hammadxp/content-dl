# Builds content-dl executables for Windows, macOS and Linux and publishes them as a GitHub release.
#
# INFO: The version is "1.<commit count>", so each release tag (v1.21, v1.22, ...) maps to one
# commit. Commits that only touch docs or tests don't trigger a release, so some numbers are skipped.
#
# checks.yml merges passing Dependabot PRs and starts this workflow by hand, because GitHub doesn't
# trigger workflows from merges made with the Actions token. Merges you make trigger it on push.

name: Release

on:
  push:
    branches: [main]
    paths:
      - "src/**"
      - "pyproject.toml"
      - "bundle/requirements.txt"
      - "scripts/build_exe.py"
      - ".github/workflows/release.yml"
      - ".github/workflows/build.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      exists: ${{ steps.version.outputs.exists }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="1.$(git rev-list --count HEAD)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if gh release view "v$version" > /dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

  build:
    needs: version
    if: needs.version.outputs.exists == 'false'
    uses: ./.github/workflows/build.yml

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/download-artifact@v5
        with:
          path: artifacts
          merge-multiple: true

      - name: Checksums
        working-directory: artifacts
        run: sha256sum content-dl* > SHA2-256SUMS

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          gh release create "v$VERSION" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "content-dl v$VERSION" \
            --generate-notes \
            --latest
