[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "content-dl"
version = "0.1.0"
description = "Extract every video, audio track, image, thumbnail and avatar from one URL, with consistent metadata."
requires-python = ">=3.10"
dependencies = ["yt-dlp>=2026.10.21", "gallery-dl>=1.32.19"]

[project.optional-dependencies]
dev = ["pytest>=8,!=9.2.0"]

[project.scripts]
content-dl = "content_dl.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests", "src"]
addopts = "--doctest-modules --import-mode=importlib"
